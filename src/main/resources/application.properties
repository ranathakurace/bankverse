# ===========================
# PostgreSQL
# ===========================

# Runtime secrets are intentionally not committed. Set these environment variables before startup:
# BANKVERSE_DB_URL, BANKVERSE_DB_USERNAME, BANKVERSE_DB_PASSWORD, BANKVERSE_JWT_SECRET
spring.datasource.url=${BANKVERSE_DB_URL}
spring.datasource.username=${BANKVERSE_DB_USERNAME}
spring.datasource.password=${BANKVERSE_DB_PASSWORD}

# ===========================
# Hibernate
# ===========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${BANKVERSE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# Server
# ===========================
server.port=8080

# Must be at least 32 UTF-8 bytes for the HS256 JWT signing key.
bankverse.jwt.secret=${BANKVERSE_JWT_SECRET}
