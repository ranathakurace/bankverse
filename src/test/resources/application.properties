spring.datasource.url=jdbc:h2:mem:bankverse_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
server.error.include-message=always
# Test-only key: production requires BANKVERSE_JWT_SECRET from its runtime environment.
bankverse.jwt.secret=bankverse-test-only-jwt-signing-key-2026
