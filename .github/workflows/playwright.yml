name: BankVerse Playwright Java UI and API

on:
  push:
    branches: [main, master]
    paths: ['src/**', 'pom.xml', 'automation-java/**', '.github/workflows/playwright.yml']
  pull_request:
    paths: ['src/**', 'pom.xml', 'automation-java/**', '.github/workflows/playwright.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Java acceptance - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      START_APP: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/automation-java/.browsers
    defaults:
      run:
        working-directory: automation-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and install matching browser dependencies
        run: mvn --batch-mode test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps ${{ matrix.browser }}"
      - name: Run API and Chromium UI tests
        if: matrix.browser == 'chromium'
        run: mvn --batch-mode test "-Dbrowser=${{ matrix.browser }}"
      - name: Run cross-browser UI tests
        if: matrix.browser != 'chromium'
        run: mvn --batch-mode test -Pui "-Dbrowser=${{ matrix.browser }}"
      - name: Publish Java acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-java-${{ matrix.browser }}
          path: |
            automation-java/target/surefire-reports/
            automation-java/target/artifacts/
            automation-java/target/application.log
          retention-days: 7
          if-no-files-found: warn
