<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1420" role="img" aria-label="Java test execution lifecycle"><rect width="1000" height="1420" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#18334d;font-size:18px}.title{font-size:27px;font-weight:bold}.small{font-size:15px;fill:#526c7d}.box{fill:#eef5fa;stroke:#7996ab;stroke-width:1.5}.accent{fill:#e6f5f1;stroke:#188575;stroke-width:1.8}.dark{fill:#123c59;stroke:#123c59}.white{fill:white}.arrow{fill:none;stroke:#59758a;stroke-width:2;marker-end:url(#arr)}.dashed{stroke-dasharray:6 5}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#59758a"/></marker></defs><text x="500" y="35" text-anchor="middle" class="title">Execution and cleanup lifecycle</text><rect x="280" y="65" width="440" height="65" rx="10" class="dark"/><text x="500" y="103.5" text-anchor="middle" class="white">Select suite, browser, configuration</text><path d="M500 130V160" class="arrow "/><path d="M500 160L640 220L500 280L360 220Z" class="accent"/><text x="500" y="212" text-anchor="middle">Managed</text><text x="500" y="236" text-anchor="middle">environment?</text><path d="M360 220H240V300" class="arrow "/><path d="M640 220H760V300" class="arrow "/><text x="275" y="209" class="small">yes</text><text x="680" y="209" class="small">no</text><rect x="60" y="300" width="360" height="75" rx="10" class="box"/><text x="240" y="331.5" text-anchor="middle" class="">Reserve port and start app</text><text x="240" y="355.5" text-anchor="middle" class="">Disposable H2 database</text><rect x="580" y="300" width="360" height="75" rx="10" class="box"/><text x="760" y="331.5" text-anchor="middle" class="">Use existing QA endpoints</text><text x="760" y="355.5" text-anchor="middle" class="">No external bootstrap</text><path d="M240 375V400H500V425" class="arrow "/><path d="M760 375V400H500" class="arrow "/><rect x="280" y="425" width="440" height="65" rx="10" class="accent"